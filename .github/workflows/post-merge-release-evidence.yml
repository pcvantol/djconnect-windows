name: Post-Merge Release Evidence

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read
  statuses: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    uses: pcvantol/djconnect/.github/workflows/post-merge-release-evidence.yml@4456023f27c72e240e01706a9ec946d3a824ab15
    with:
      policy_source_ref: 4456023f27c72e240e01706a9ec946d3a824ab15
      required_main_workflow: CI
      required_check_contexts: '["Trusted Delivery qualification / Qualify trusted delivery"]'
      repository_role: active_source
      coverage_artifact_name: windows-cobertura-coverage
